<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Localidades</title>
<style>
@page{size:letter;margin:0.9in}
body{font-family:Inter,'DejaVu Sans',sans-serif;color:#222;margin:0}
.tag{display:inline-block;border:1.5px solid #B45309;color:#B45309;font-weight:700;font-size:11pt;letter-spacing:1px;padding:4px 10px;border-radius:4px}
h1{font-size:30pt;letter-spacing:2px;margin:0 0 6px}
.sub{color:#666;font-size:11pt;margin-bottom:28px}
table{width:100%;border-collapse:collapse;font-size:14pt}
th{text-align:left;font-size:10.5pt;color:#666;text-transform:uppercase;letter-spacing:1px;border-bottom:2px solid #222;padding:10px 8px}
td{padding:14px 8px;border-bottom:1px solid #ddd}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.loc{font-weight:800}
tr.tot td{border-bottom:none;border-top:2px solid #222;font-weight:800}
</style></head><body>
<h1>LOCALIDADES</h1>
<div class="sub">Aforo y precios.</div>
<table>
<tr><th>Localidad</th><th class="n">Aforo</th><th class="n">Precio</th></tr>
<tr><td class="loc">ULTRA</td><td class="n">600</td><td class="n">Q1,300</td></tr>
<tr><td class="loc">VIP</td><td class="n">900</td><td class="n">Q900</td></tr>
<tr><td class="loc">PREFERENCIA</td><td class="n">1,000</td><td class="n">Q550</td></tr>
<tr><td class="loc">GENERAL</td><td class="n">1,000</td><td class="n">Q300</td></tr>
<tr class="tot"><td>Total</td><td class="n">3,500</td><td></td></tr>
</table>
</body></html>
